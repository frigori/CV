name: Build CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'cv/**/*.tex'
      - '.github/workflows/build-cv.yml'
  pull_request:
    paths:
      - 'cv/**/*.tex'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compile LaTeX CVs
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile CV PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv/it/CV-IT-public.tex
            cv/en/CV_EN-public.tex
            cv/fr/CV_FR-public.tex
            cv/fr/CV_FR-alternance-ia-data.tex
            cv/fr/CV_FR-alternance-ia-spatial.tex
          latexmk_use_xelatex: false
          work_in_root_file_dir: true
          args: -pdf -interaction=nonstopmode -file-line-error -halt-on-error

      - name: Upload French public-safe CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-fr-public-pdf
          path: cv/fr/CV_FR-public.pdf
          if-no-files-found: error

      - name: Upload French alternance IA/data/RAG CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-fr-alternance-ia-data-pdf
          path: cv/fr/CV_FR-alternance-ia-data.pdf
          if-no-files-found: error

      - name: Upload French alternance IA/spatial CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-fr-alternance-ia-spatial-pdf
          path: cv/fr/CV_FR-alternance-ia-spatial.pdf
          if-no-files-found: error

      - name: Prepare public site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p site
          cp cv/it/CV-IT-public.pdf site/CV-IT.pdf
          cp cv/en/CV_EN-public.pdf site/CV_EN.pdf
          cp cv/fr/CV_FR-public.pdf site/CV_FR.pdf
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="it">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex, nofollow">
            <title>Mattia Giovannini — CV</title>
            <style>
              :root { --ink: #201d18; --sub: #6b6459; --line: #e6e1d6; --panel: #faf8f4; --amber: #a8660c; }
              * { box-sizing: border-box; }
              body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 34rem; margin: 4.5rem auto; padding: 0 1.5rem; line-height: 1.6; color: var(--ink); background: #fff; }
              h1 { margin: 0 0 2rem; font-size: 1.6rem; }
              .cards { display: grid; gap: 0.75rem; }
              a.card { display: flex; align-items: baseline; gap: 0.85rem; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: inherit; background: var(--panel); transition: border-color 0.15s ease, background 0.15s ease; }
              a.card:hover { border-color: var(--amber); background: #fff; }
              .code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.78rem; font-weight: 600; color: var(--amber); flex-shrink: 0; width: 1.6rem; }
              .label { font-weight: 600; display: block; }
              .desc { color: var(--sub); font-size: 0.88rem; }
              .note { margin-top: 2.5rem; color: var(--sub); font-size: 0.85rem; }
            </style>
          </head>
          <body>
            <h1>Mattia Giovannini — CV</h1>
            <div class="cards">
              <a class="card" href="CV-IT.pdf"><span class="code">IT</span><span><span class="label">CV Italiano</span><span class="desc">Scarica/apri il PDF in italiano</span></span></a>
              <a class="card" href="CV_EN.pdf"><span class="code">EN</span><span><span class="label">English CV</span><span class="desc">Download/open the English PDF</span></span></a>
              <a class="card" href="CV_FR.pdf"><span class="code">FR</span><span><span class="label">CV Français</span><span class="desc">Télécharger/ouvrir le PDF en français</span></span></a>
            </div>
            <p class="note">Ultimo aggiornamento pubblicato automaticamente tramite GitHub Actions.</p>
          </body>
          </html>
          HTML

      - name: Setup GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
